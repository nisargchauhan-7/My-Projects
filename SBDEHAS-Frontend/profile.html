<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-danger">

<div class="container">

<a class="navbar-brand" href="index.html">
SBDEHAS
</a>

<div>

<a href="dashboard.html" class="btn btn-light btn-sm me-2">
Dashboard
</a>

<button
class="btn btn-light btn-sm"
onclick="logout()">

Logout

</button>

</div>

</div>

</nav>

<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow">

<div class="card-body">

<h2 class="text-center text-danger mb-4">

My Profile

</h2>

<table class="table">

<tr>
<th>Full Name</th>
<td id="profileName"></td>
</tr>

<tr>
<th>Email</th>
<td id="profileEmail"></td>
</tr>

<tr>
<th>City</th>
<td id="profileCity"></td>
</tr>

</table>

</div>

</div>

</div>

</div>

</div>

<footer class="bg-dark text-white text-center py-4 mt-5">

<p class="mb-0">

© 2026 Smart Blood Donor & Emergency Healthcare Assistance System

</p>

</footer>

<script>

let currentUser =
JSON.parse(
localStorage.getItem("currentUser")
);

if(!currentUser)
{
    alert("Please Login First");

    window.location.href =
    "login.html";
}

document.getElementById("profileName")
.innerHTML =
currentUser.name;

document.getElementById("profileEmail")
.innerHTML =
currentUser.email;

document.getElementById("profileCity")
.innerHTML =
currentUser.city;

function userLogout()
{
    localStorage.removeItem(
        "currentUser"
    );

    window.location.href =
    "index.html";
}

</script>

</body>
</html>
